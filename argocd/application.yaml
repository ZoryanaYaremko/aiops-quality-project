apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-quality-project
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ZoryanaYaremko/aiops-quality-project.git
    targetRevision: main
    path: helm

  destination:
    server: https://kubernetes.default.svc
    namespace: application

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
